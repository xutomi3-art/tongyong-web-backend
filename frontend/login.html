<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center">
  <!-- 登录卡片 -->
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <!-- Logo和标题 -->
    <div class="text-center mb-8">
      <div class="inline-block p-3 bg-gradient-to-r from-purple-600 to-blue-600 rounded-full mb-4">
        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">管理后台</h1>
      <p class="text-gray-500">请登录以继续</p>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" class="space-y-6">
      <!-- 用户名输入框 -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
          用户名
        </label>
        <input
          type="text"
          id="username"
          name="username"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
          placeholder="请输入用户名"
          required
          autocomplete="username"
        />
      </div>

      <!-- 密码输入框 -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          密码
        </label>
        <input
          type="password"
          id="password"
          name="password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
          placeholder="请输入密码"
          required
          autocomplete="current-password"
        />
      </div>

      <!-- 错误提示 -->
      <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        <span id="errorText"></span>
      </div>

      <!-- 登录按钮 -->
      <button
        type="submit"
        id="loginButton"
        class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 rounded-lg font-medium hover:from-purple-700 hover:to-blue-700 transition transform hover:scale-[1.02] active:scale-[0.98]"
      >
        登录
      </button>
    </form>

    <!-- 底部提示 -->
    <div class="mt-6 text-center text-sm text-gray-500">
      <p>默认账号：admin / Jototech@123</p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    // 处理登录表单提交
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }

      // 禁用按钮，显示加载状态
      loginButton.disabled = true;
      loginButton.textContent = '登录中...';
      errorMessage.classList.add('hidden');

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // 登录成功，保存token并跳转
          if (data.token) {
            localStorage.setItem('adminToken', data.token);
          }
          window.location.href = '/admin/admin.html';
        } else {
          // 登录失败，显示错误信息
          showError(data.message || '登录失败，请检查用户名和密码');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('网络错误，请稍后重试');
      } finally {
        // 恢复按钮状态
        loginButton.disabled = false;
        loginButton.textContent = '登录';
      }
    });

    // 显示错误信息
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    // 检查是否已登录
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('adminToken');
      if (token) {
        // 验证token是否有效
        fetch('/api/admin/verify', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        })
        .then(res => res.json())
        .then(data => {
          if (data.valid) {
            window.location.href = '/admin/admin.html';
          }
        })
        .catch(() => {
          // Token无效，清除并继续显示登录页面
          localStorage.removeItem('adminToken');
        });
      }
    });
  </script>
</body>
</html>
